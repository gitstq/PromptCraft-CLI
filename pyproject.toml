[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptcraft-cli"
version = "1.0.0"
description = "🚀 Lightweight Prompt Engineering & Version Management CLI Tool"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "PromptCraft Team", email = "promptcraft@example.com"}
]
keywords = ["prompt", "engineering", "llm", "ai", "cli", "version-control"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
clipboard = ["pyperclip>=1.8.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
promptcraft = "promptcraft.cli:main"
pc = "promptcraft.cli:main"

[project.urls]
Homepage = "https://github.com/gitstq/promptcraft-cli"
Documentation = "https://github.com/gitstq/promptcraft-cli#readme"
Repository = "https://github.com/gitstq/promptcraft-cli"
"Bug Tracker" = "https://github.com/gitstq/promptcraft-cli/issues"

[tool.setuptools]
packages = ["promptcraft", "promptcraft.core", "promptcraft.ui", "promptcraft.utils"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
